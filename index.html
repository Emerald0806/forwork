<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>學員分組抽籤系統</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg-1: #f0e6d8;
      --bg-2: #dce8df;
      --card: rgba(255, 253, 248, 0.97);
      --text: #354238;
      --muted: #69766c;
      --line: #d6c9bb;
      --primary: #7fa58a;
      --primary-dark: #557761;
      --sage: #8ebf9a;
      --clay: #c79d7c;
      --dusty-blue: #7f9fb3;
      --rose: #c28f8f;
      --lavender: #9d8cc4;
      --soft: #f8f1e8;
      --soft-green: #edf6ee;
      --soft-blue: #edf5f7;
      --soft-purple: #f3eff9;
      --danger: #b96f6f;
      --warning: #c79d7c;
    }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      width: min(1400px, 100%);
      margin: 0 auto;
      background: var(--card);
      border-radius: 24px;
      box-shadow: 0 18px 45px rgba(73, 82, 76, 0.14);
      overflow: hidden;
      border: 1px solid rgba(215, 208, 197, 0.7);
    }

    .hero {
      padding: 34px 32px 28px;
      background: linear-gradient(135deg, #7fa58a 0%, #7f9fb3 100%);
      color: #fffdf8;
      text-align: center;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 4vw, 46px);
      letter-spacing: 1px;
      font-weight: 800;
    }

    .hero p {
      margin: 0;
      opacity: 0.96;
      font-size: 17px;
      line-height: 1.7;
    }

    main { padding: 28px; }

    .card {
      background: #fffdf8;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(73, 82, 76, 0.07);
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title h2 {
      font-size: 22px;
      margin: 0;
      color: #314036;
    }

    .hint {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin: 8px 0 12px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      line-height: 1.7;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fffaf3;
      color: var(--text);
    }

    textarea:focus, input:focus {
      border-color: var(--dusty-blue);
      box-shadow: 0 0 0 4px rgba(127, 159, 179, 0.2);
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin-top: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #47584b;
      margin-bottom: 8px;
    }

    input[type="number"], input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
      background: #fffaf3;
      color: var(--text);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 22px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(73, 82, 76, 0.18);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    .primary { background: var(--primary); color: #fffdf8; }
    .success { background: var(--sage); color: #fffdf8; }
    .warning { background: var(--warning); color: #fffdf8; }
    .danger { background: var(--danger); color: #fffdf8; }
    .secondary { background: #eadbc9; color: #47584b; }
    .purple { background: var(--lavender); color: #fffdf8; }
    .blue { background: var(--dusty-blue); color: #fffdf8; }

    .status-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .status-bar.compact {
      display: none;
    }

    .stat {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 26px;
      color: var(--primary-dark);
      margin-bottom: 4px;
    }

    .stat span {
      color: var(--muted);
      font-size: 13px;
    }

    .message {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      display: none;
    }

    .message.show { display: block; }
    .message.info { background: var(--soft-blue); color: #4f6c78; border: 1px solid #cddfe5; }
    .message.error { background: #f7eeee; color: #925151; border: 1px solid #e7caca; }

    .draw-area { display: none; }
    .draw-area.show { display: flex; }

    .late-section {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: 18px;
      background: var(--soft-purple);
      border: 1px solid #ddd2ec;
    }

    .late-section.show { display: block; }
    .late-section textarea { min-height: 82px; background: #fffdf8; }

    .current-group {
      margin: 18px 0;
      padding: 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--soft-green) 0%, var(--soft-blue) 100%);
      border: 1px solid #d1e3d3;
      animation: fadeIn 0.35s ease;
    }

    .current-group h3 {
      margin: 0 0 14px;
      color: #557761;
      font-size: 28px;
      text-align: center;
    }

    .student-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .student-item {
      background: #fffdf8;
      border: 1px solid #d4e5cf;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: #40584a;
    }

    .student-item.late {
      border-color: #d4c6e8;
      background: #f8f3fc;
      color: #75669b;
    }

    .all-groups {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .group-card {
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      background: #fffdf8;
      min-width: 0;
      box-shadow: 0 6px 18px rgba(73, 82, 76, 0.06);
    }

    .group-card h4 {
      margin: 0 0 12px;
      font-size: 23px;
      line-height: 1.35;
      color: #314036;
      font-weight: 900;
      text-align: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #eadbc9;
    }

    .group-card ol {
      margin: 0;
      padding-left: 24px;
      font-size: 19px;
      line-height: 2.05;
      font-weight: 700;
      color: #40584a;
    }

    .group-card li::marker {
      color: var(--primary-dark);
      font-weight: 900;
    }

    .late-tag {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 12px;
      background: #eee4f7;
      color: #75669b;
      font-weight: 700;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 24px;
      border: 1px dashed #cfc0b0;
      border-radius: 16px;
      background: #fbf5ec;
    }

    body.presentation-mode {
      padding: 0;
      background: #f4eadf;
      overflow-x: hidden;
    }

    body.presentation-mode .container {
      width: 100%;
      min-height: 100vh;
      border-radius: 0;
      box-shadow: none;
      border: none;
      background: #fffaf3;
    }

    body.presentation-mode .hero,
    body.presentation-mode .input-card,
    body.presentation-mode .section-title,
    body.presentation-mode .status-bar,
    body.presentation-mode .button-row,
    body.presentation-mode .message,
    body.presentation-mode .late-section,
    body.presentation-mode .current-group,
    body.presentation-mode .empty-state {
      display: none !important;
    }

    body.presentation-mode main {
      padding: 24px;
    }

    body.presentation-mode .card {
      border: none;
      box-shadow: none;
      background: transparent;
      padding: 0;
      margin: 0;
    }

    body.presentation-mode .all-groups {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
      margin-top: 0;
    }

    body.presentation-mode .group-card {
      padding: 22px;
      border-radius: 24px;
      border: 2px solid #dcc7b1;
      background: #fffdf8;
    }

    body.presentation-mode .group-card h4 {
      font-size: 30px;
      color: #557761;
      margin-bottom: 16px;
    }

    body.presentation-mode .group-card ol {
      font-size: 25px;
      line-height: 2.05;
      padding-left: 30px;
    }

    .presentation-exit {
      display: none;
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 99;
      background: var(--danger);
      color: #fff;
      box-shadow: 0 8px 22px rgba(0,0,0,0.18);
    }

    body.presentation-mode .presentation-exit {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1000px) {
      .all-groups { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      body.presentation-mode .all-groups { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      body { padding: 12px; }
      main { padding: 18px; }
      .all-groups { grid-template-columns: 1fr; }
      .group-card ol { font-size: 18px; }
      body.presentation-mode .all-groups { grid-template-columns: 1fr; }
    }

    @media print {
      body { background: #fff; padding: 0; }
      .container { box-shadow: none; border-radius: 0; }
      .hero, .input-card, .button-row, .message, .current-group, .late-section, .presentation-exit { display: none !important; }
      main { padding: 0; }
      .card { box-shadow: none; border: none; }
      .all-groups { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="hero">
      <h1>學員分組抽籤系統</h1>
      <p>貼上學員名單，設定「分幾組」，系統會自動平均分配人數；若有遲到學員，也能補進人數最少的組別。</p>
    </header>

    <main>
      <section class="card input-card">
        <div class="section-title">
          <h2>一、輸入學員名單</h2>
        </div>
        <p class="hint">請一行輸入一位學員，也可以用逗號、頓號、空白分隔。系統會自動移除空白與重複姓名。</p>
        <textarea id="studentInput" placeholder="例如：
王小明
陳美玲
林志豪
張雅婷"></textarea>

        <div class="settings-grid">
          <div>
            <label for="targetGroupCount">要分成幾組</label>
            <input id="targetGroupCount" type="number" min="1" value="7" />
          </div>
        </div>

        <div class="button-row">
          <button class="primary" onclick="generateGroups()">隨機平均分組</button>
          <button class="secondary" onclick="loadSample()">載入 43 人範例</button>
          <button class="danger" onclick="resetAll()">清空重來</button>
        </div>

        <div id="message" class="message"></div>
      </section>

      <section class="card">
        <div class="section-title" id="resultTitle">
          <h2>二、抽籤結果</h2>
        </div>

        <div class="status-bar" id="statusBar">
          <div class="stat">
            <strong id="studentCount">0</strong>
            <span>有效學員數</span>
          </div>
          <div class="stat">
            <strong id="groupCount">0</strong>
            <span>總組數</span>
          </div>
          <div class="stat">
            <strong id="groupSizePreview">-</strong>
            <span>人數分配</span>
          </div>
          <div class="stat">
            <strong id="drawProgress">0 / 0</strong>
            <span>已抽組數</span>
          </div>
        </div>

        <div class="button-row draw-area" id="drawControls">
          <button class="success" id="drawNextBtn" onclick="drawNextGroup()">抽下一組</button>
          <button class="warning" onclick="redrawGroups()">全部重抽</button>
          <button class="purple" onclick="toggleLateSection()">遲到學員加入</button>
          <button class="secondary" onclick="showAllGroups()">顯示全部組別</button>
          <button class="blue" onclick="enterPresentationMode()">全螢幕分組模式</button>
          <button class="secondary" onclick="exportCSV()">匯出 CSV</button>
          <button class="secondary" onclick="window.print()">列印</button>
        </div>

        <div id="lateSection" class="late-section">
          <h3 style="margin: 0 0 8px; color:#75669b;">遲到學員加入</h3>
          <p class="hint">輸入一位或多位遲到學員，系統會依序放進目前人數最少的組別。若有多組人數相同，會優先補進前面的組別。</p>
          <textarea id="lateStudentInput" placeholder="例如：
王大明
李小花"></textarea>
          <div class="button-row">
            <button class="purple" onclick="addLateStudents()">加入並自動補位</button>
            <button class="secondary" onclick="document.getElementById('lateStudentInput').value = ''">清空遲到名單</button>
          </div>
        </div>

        <div id="currentGroup"></div>
        <div id="allGroups" class="all-groups"></div>
        <div id="emptyState" class="empty-state">尚未產生分組。請先輸入學員名單並按下「隨機平均分組」。</div>
      </section>
    </main>
  </div>

  <button class="presentation-exit" onclick="exitPresentationMode()">離開全螢幕模式</button>

  <script>
    let groups = [];
    let currentDrawIndex = 0;
    let lateStudentNames = new Set();

    function normalizeStudents(rawText) {
      return rawText
        .split(/[\n,，、\s]+/)
        .map(name => name.trim())
        .filter(Boolean)
        .filter((name, index, array) => array.indexOf(name) === index);
    }

    function shuffleArray(array) {
      const result = [...array];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function generateGroups() {
      const rawText = document.getElementById("studentInput").value;
      const targetGroupCount = Number(document.getElementById("targetGroupCount").value);
      const students = normalizeStudents(rawText);

      if (students.length === 0) {
        showMessage("請先輸入至少一位學員。", "error");
        return;
      }

      if (!Number.isInteger(targetGroupCount) || targetGroupCount < 1) {
        showMessage("組數必須是大於 0 的整數。", "error");
        return;
      }

      if (targetGroupCount > students.length) {
        showMessage("組數不能大於學員人數，否則會出現空組。", "error");
        return;
      }

      const shuffledStudents = shuffleArray(students);
      groups = createBalancedGroups(shuffledStudents, targetGroupCount);
      currentDrawIndex = 0;
      lateStudentNames = new Set();

      updateStats(students.length);
      clearResultDisplays();
      document.getElementById("drawControls").classList.add("show");
      document.getElementById("emptyState").style.display = "none";
      document.getElementById("drawNextBtn").disabled = false;
      document.getElementById("lateStudentInput").value = "";
      document.getElementById("statusBar").classList.remove("compact");

      showMessage(`分組完成：共 ${students.length} 位學員，分成 ${groups.length} 組，人數分配為 ${getGroupSizeSummary()}。`, "info");
    }

    function createBalancedGroups(students, targetGroupCount) {
      const baseSize = Math.floor(students.length / targetGroupCount);
      const extraCount = students.length % targetGroupCount;
      const result = [];
      let currentIndex = 0;

      for (let i = 0; i < targetGroupCount; i++) {
        const size = baseSize + (i < extraCount ? 1 : 0);
        result.push(students.slice(currentIndex, currentIndex + size));
        currentIndex += size;
      }

      return result;
    }

    function toggleLateSection() {
      if (groups.length === 0) {
        showMessage("請先完成分組，再加入遲到學員。", "error");
        return;
      }
      document.getElementById("lateSection").classList.toggle("show");
    }

    function addLateStudents() {
      if (groups.length === 0) {
        showMessage("請先完成分組，再加入遲到學員。", "error");
        return;
      }

      const lateStudents = normalizeStudents(document.getElementById("lateStudentInput").value);
      if (lateStudents.length === 0) {
        showMessage("請輸入至少一位遲到學員。", "error");
        return;
      }

      const existingStudents = new Set(groups.flat());
      const addedRecords = [];
      const skippedStudents = [];

      lateStudents.forEach(student => {
        if (existingStudents.has(student)) {
          skippedStudents.push(student);
          return;
        }

        const targetIndex = findSmallestGroupIndex();
        groups[targetIndex].push(student);
        existingStudents.add(student);
        lateStudentNames.add(student);
        addedRecords.push(`${student} → ${getGroupName(targetIndex)}`);
      });

      document.getElementById("lateStudentInput").value = "";
      updateStats();
      refreshVisibleResults();

      let text = "";
      if (addedRecords.length > 0) {
        text += `已加入 ${addedRecords.length} 位遲到學員：${addedRecords.join("；")}。目前人數分配為 ${getGroupSizeSummary()}。`;
      }
      if (skippedStudents.length > 0) {
        text += `${text ? " " : ""}以下姓名已在分組中，未重複加入：${skippedStudents.join("、")}。`;
      }
      showMessage(text || "沒有新增任何學員。", addedRecords.length > 0 ? "info" : "error");
    }

    function findSmallestGroupIndex() {
      let smallestIndex = 0;
      for (let i = 1; i < groups.length; i++) {
        if (groups[i].length < groups[smallestIndex].length) smallestIndex = i;
      }
      return smallestIndex;
    }

    function refreshVisibleResults() {
      const allGroupsDiv = document.getElementById("allGroups");
      if (allGroupsDiv.innerHTML.trim()) showAllGroups();

      const currentGroupDiv = document.getElementById("currentGroup");
      if (currentGroupDiv.innerHTML.trim() && currentDrawIndex > 0) renderCurrentGroup(currentDrawIndex - 1);
    }

    function drawNextGroup() {
      if (groups.length === 0) {
        showMessage("請先產生分組。", "error");
        return;
      }

      if (currentDrawIndex >= groups.length) {
        showMessage("所有組別都已抽完。", "info");
        document.getElementById("drawNextBtn").disabled = true;
        return;
      }

      renderCurrentGroup(currentDrawIndex);
      currentDrawIndex += 1;
      updateStats();

      if (currentDrawIndex >= groups.length) {
        document.getElementById("drawNextBtn").disabled = true;
        showMessage("所有組別都已抽完。", "info");
      }
    }

    function renderCurrentGroup(index) {
      const group = groups[index];
      const groupName = getGroupName(index);
      const currentGroupDiv = document.getElementById("currentGroup");

      currentGroupDiv.innerHTML = `
        <div class="current-group">
          <h3>${groupName}｜${group.length} 人</h3>
          <div class="student-list">
            ${group.map(student => `<div class="student-item ${lateStudentNames.has(student) ? "late" : ""}">${escapeHTML(student)}${lateStudentNames.has(student) ? "（遲到補入）" : ""}</div>`).join("")}
          </div>
        </div>
      `;
    }

    function showAllGroups() {
      if (groups.length === 0) {
        showMessage("請先產生分組。", "error");
        return;
      }

      document.getElementById("statusBar").classList.add("compact");

      const allGroupsDiv = document.getElementById("allGroups");
      allGroupsDiv.innerHTML = groups.map((group, index) => `
        <div class="group-card">
          <h4>${getGroupName(index)}｜${group.length} 人</h4>
          <ol>
            ${group.map(student => `<li>${escapeHTML(student)}${lateStudentNames.has(student) ? '<span class="late-tag">遲到補入</span>' : ''}</li>`).join("")}
          </ol>
        </div>
      `).join("");
    }

    function enterPresentationMode() {
      if (groups.length === 0) {
        showMessage("請先產生分組，才能進入全螢幕分組模式。", "error");
        return;
      }

      showAllGroups();
      document.body.classList.add("presentation-mode");

      const elem = document.documentElement;
      if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
    }

    function exitPresentationMode() {
      document.body.classList.remove("presentation-mode");
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        exitPresentationMode();
      }
    });

    function redrawGroups() {
      if (!document.getElementById("studentInput").value.trim()) {
        showMessage("目前沒有學員名單可以重抽。", "error");
        return;
      }
      generateGroups();
    }

    function exportCSV() {
      if (groups.length === 0) {
        showMessage("請先產生分組，才能匯出 CSV。", "error");
        return;
      }

      const rows = [["組別", "序號", "姓名", "備註"]];
      groups.forEach((group, groupIndex) => {
        group.forEach((student, studentIndex) => {
          rows.push([getGroupName(groupIndex), String(studentIndex + 1), student, lateStudentNames.has(student) ? "遲到補入" : ""]);
        });
      });

      const csvContent = rows
        .map(row => row.map(cell => `"${String(cell).replaceAll('"', '""')}"`).join(","))
        .join("\n");

      const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `學員分組名單_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function resetAll() {
      document.getElementById("studentInput").value = "";
      document.getElementById("targetGroupCount").value = 7;
      document.getElementById("lateStudentInput").value = "";
      groups = [];
      currentDrawIndex = 0;
      lateStudentNames = new Set();
      updateStats(0);
      clearResultDisplays();
      document.getElementById("drawControls").classList.remove("show");
      document.getElementById("lateSection").classList.remove("show");
      document.getElementById("emptyState").style.display = "block";
      document.getElementById("statusBar").classList.remove("compact");
      exitPresentationMode();
      hideMessage();
    }

      document.getElementById("studentInput").value = [
        "王小明", "陳美玲", "林志豪", "張雅婷", "黃冠宇", "李佳蓉", "吳柏翰",

        "曾俊傑", "洪雅雯", "邱彥廷", "廖品妤", "賴冠廷", "傅佳穎", "蘇柏宇",
        "葉思涵", "江建宏", "潘郁婷", "羅明哲", "高婉婷", "徐承佑", "戴欣妤",
        "呂冠霖", "白雅筑", "宋柏翰", "范怡萱", "方子豪", "石佳蓉", "任威廷",

      ].join("\n");

      showMessage("已載入 43 人範例，設定為分 7 組，可直接按下「隨機平均分組」。", "info");
    }

    function updateStats(studentTotal) {
      const effectiveStudentTotal = typeof studentTotal === "number"
        ? studentTotal
        : groups.reduce((sum, group) => sum + group.length, 0);

      document.getElementById("studentCount").textContent = effectiveStudentTotal;
      document.getElementById("groupCount").textContent = groups.length;
      document.getElementById("groupSizePreview").textContent = groups.length ? getGroupSizeSummary() : "-";
      document.getElementById("drawProgress").textContent = `${currentDrawIndex} / ${groups.length}`;
    }

    function getGroupSizeSummary() {
      return groups.map(group => group.length).join("、");
    }

    function clearResultDisplays() {
      document.getElementById("currentGroup").innerHTML = "";
      document.getElementById("allGroups").innerHTML = "";
    }

    function getGroupName(index) {
      return `第 ${index + 1} 組`;
    }

    function showMessage(text, type) {
      const message = document.getElementById("message");
      message.textContent = text;
      message.className = `message ${type} show`;
    }

    function hideMessage() {
      const message = document.getElementById("message");
      message.textContent = "";
      message.className = "message";
    }

    function escapeHTML(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
